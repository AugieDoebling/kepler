[pytest]
# The *_test.py files are manual scripts that run when imported, only collect test_*.py
python_files = test_*.py
testpaths = .
norecursedirs = .venv venv aiyprojects-raspbian-aiyprojects hexarth_example
# The repo root has an __init__.py, so put it on the path for imports like "from memory import ..."
pythonpath = .
